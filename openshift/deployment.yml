apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-capstone
  labels:
    app: devops-capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-capstone
  template:
    metadata:
      labels:
        app: devops-capstone
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/devops-capstone/devops-capstone:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
